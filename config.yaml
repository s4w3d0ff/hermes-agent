model:
  default: qwen38
  provider: custom
  base_url: http://192.168.8.164:8080/v1
  context_length: 200000
toolsets:
  - hermes-cli
  - clarify
  - project
  - context_engine
  - discord
  - discord_admin
  - kanban
platforms:
  discord:
    enabled: false
platform_toolsets:
  cli:
    - hermes-cli
    - clarify
    - project
    - kanban
    - context_engine
    - discord
    - discord_admin
  discord:
    - hermes-cli
    - clarify
    - project
    - kanban
    - context_engine
    - discord
    - discord_admin
agent:
  max_turns: 4200
  max_verify_nudges: 6
  verbose: true
  reasoning_effort: high
  clarify_timeout: 4200
  tool_use_enforcement: true
  disabled_toolsets:
    - discord
    - discord_admin
    - kanban
    - cronjob
    - delegation
    - computer_use
    - vision
    - video
    - image_gen
    - video_gen
    - tts
    - homeassistant
    - yuanbao
    - spotify
    - feishu_doc
    - feishu_drive
    - x_search
kanban:
  dispatch_in_gateway: false
discord:
  unauthorized_dm_behavior: ignore
  allowed_channels: '1518715078608683088'
  auto_thread: false
  bots_require_inline_mention: true
  approval_mentions: true
  voice_fx:
    ambient_enabled: false
context:
  engine: compressor
context_file_max_chars: 50000
file_read_max_chars: 200000
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 8200
  user_char_limit: 4375
  nudge_interval: 10
  flush_min_turns: 6
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.25
  protect_last_n: 25
  protect_first_n: 10
display:
  compact: false
  busy_input_mode: steer
  bell_on_complete: false
  show_reasoning: true
  streaming: true
  skin: horus
  interim_assistant_messages: true
  tool_progress: verbose
  tool_progress_command: true
  tool_preview_length: 0
  show_commentary: true
  show_cost: true
  timestamps: true
  resume_display: full
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  language: en
skills:
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 15
terminal:
  backend: local
  timeout: 360
  home_mode: auto
  cwd: '~'
  persistent_shell: true
tool_output:
  max_bytes: 150000
  max_lines: 5000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 3
  hard_stop_after:
    exact_failure: 4
    same_tool_failure: 5
    idempotent_no_progress: 5
telemetry:
  shared_metrics:
    enabled: false
goals:
  max_turns: 420
web:
  backend: ddgs
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: camofox
  extension_control:
    enabled: false
prompt_caching:
  cache_ttl: 2m
stt:
  enabled: false
delegation:
  max_iterations: 250
code_execution:
  timeout: 360
  max_tool_calls: 200
onboarding:
  seen:
    tool_progress_prompt: true
    profile_build_offered: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 45
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
approvals:
  destructive_slash_confirm: false
