# Spinner — owl waits, Eye of Horus thinks. Glyphs verified against the
# Unicode Egyptian Hieroglyphs chart (Gardiner codes in comments).
spinner:
  waiting_faces:
    - "(𓅓)"   # G17 owl — it watches while you wait
    - "(𓊽)"   # R11 djed pillar — stability
    - "(𓋹)"   # S34 ankh — life
  thinking_faces:
    - "(𓂀)"   # D10 Eye of Horus (udjat)
    - "(𓆄)"   # H6 feather of Maat — truth/pondering
    - "(𓁛)"   # C2 falcon god with sun-disk and ankh — Ra/Horus
  thinking_verbs:
    - "decreeing"
    - "inscribing"
    - "divining"
    - "weighing the heart"
  wings:
    - ["𓌀", "𓌀"]   # S40 was-scepter, power/dominion
    - ["𓂀", "𓂀"]   # D10 Eye of Horus

branding:
  agent_name: Horus
  welcome: "𓂀 The Eye of Horus watches over your work. Speak."
  goodbye: "May Maat keep your path true. 𓋹"
  response_label: " 𓁛 Horus 𓁛"
  prompt_symbol: "𓂀"   # D10 Eye of Horus replaces the ❯
  help_header: "𓊽 Commands — the djed stands firm"

# Tool-output line prefix (default is ┊). Djed pillar: stability.
tool_prefix: "𓊽"

