model:
  provider: lmstudio
  default: qwen3.6-35b-a3b
  base_url: http://192.168.1.232:1234/v1
  context_length: 256000
fallback_providers:
  - provider: openrouter
    model: free
    context_length: 200000
credential_pool_strategies:
  openrouter: round_robin
auxiliary:
  vision:
    provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  compression:
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  title_generation:
    provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  profile_describer:
    provider: openrouter
    model: google/gemma-4-26b-a4b-it:free
  curator:
    provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
toolsets:
  - hermes-cli
  - cronjob
  - clarify
  - kanban
  - context_engine
  - discord
  - discord_admin
  - project
platforms:
  discord:
    enabled: false
platform_toolsets:
  cli:
    - hermes-cli
    - cronjob
    - clarify
    - kanban
    - context_engine
  discord:
    - hermes-cli
    - cronjob
    - clarify
    - kanban
    - context_engine
    - discord
    - discord_admin
agent:
  max_turns: 420
  max_verify_nudges: 6
  verbose: true
  reasoning_effort: high
  clarify_timeout: 4200
  tool_use_enforcement: true
  disabled_toolsets:
    - delegation
    - computer_use
    - vision
    - video
    - image_gen
    - video_gen
    - tts
    - spotify
    - homeassistant
    - yuanbao
    - feishu_doc
    - feishu_drive
    - x_search
kanban:
  dispatch_in_gateway: false
discord:
  unauthorized_dm_behavior: ignore
  allowed_channels: '1518715078608683088'
  auto_thread: false
  bots_require_inline_mention: true
  approval_mentions: true
  voice_fx:
    ambient_enabled: false
terminal:
  backend: local
  timeout: 360
  home_mode: auto
  cwd: "~"
  persistent_shell: true
tool_output:
  max_bytes: 150000
  max_lines: 5000
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 3
  hard_stop_after:
    exact_failure: 4
    same_tool_failure: 5
    idempotent_no_progress: 5
context:
  engine: compressor
context_file_max_chars: 50000
file_read_max_chars: 200000
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 8200
  user_char_limit: 4375
  nudge_interval: 10
  flush_min_turns: 6
compression:
  enabled: true
  threshold: 0.9
  target_ratio: 0.6
  protect_last_n: 25
  protect_first_n: 10
display:
  compact: false
  busy_input_mode: "steer"
  bell_on_complete: false
  show_reasoning: true
  streaming: true
  skin: sisyphus
  interim_assistant_messages: true
  tool_progress: verbose
  tool_progress_command: true
  tool_preview_length: 0
  show_commentary: true
  show_cost: true
  timestamps: true
  resume_display: full
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
  language: en
skills:
  guard_agent_created: true
  write_approval: false
  creation_nudge_interval: 15
goals:
  max_turns: 420
web:
  backend: ddgs
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: camofox
  use_gateway: false
prompt_caching:
  cache_ttl: 2m
stt:
  enabled: false
delegation:
  max_iterations: 50
code_execution:
  timeout: 360
  max_tool_calls: 100
onboarding:
  seen:
    tool_progress_prompt: true
    profile_build_offered: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
approvals:
  destructive_slash_confirm: false
  deny:
    # Never allow chaining bash commands beyond 2
    - '*&&*&&*'
    - '*&&*;*'
    - '*&&*||*'
    - '*||*||*'
    - '*||*;*'
    - '*||*&&*'
    - '*;*;*'
    - '*;*&&*'
    - '*;*||*'
    # Never allow inline echos with chains
    - '*echo*&&*'
    - '*echo*;*'
    - '*echo*||*'
    - '*&&*echo*'
    - '*;*echo*'
    - '*||*echo*'
    # Hermes: commands an agent should never use
    - 'hermes *chat*'
    - 'hermes profile use*'
    - 'hermes *desktop*'
    - 'hermes *dashboard*'
    - 'hermes *uninstall'
    - 'hermes *pets*'
    - 'hermes *tools*'
    - 'hermes *pairing*'
    - 'hermes *acp*'
    - 'hermes *mcp*'
    - 'hermes *curator*'
    - 'hermes *portal*'
    - 'hermes *config*'
    - 'hermes *doctor*'
    - 'hermes *migrate*'
    - 'hermes *secrets*'
    - 'hermes *send*'
    - 'hermes *gateway*'
    - 'hermes *setup*'
    # Git: never destroy or rewrite remote history
    - 'git push --force*'
    - 'git push -*f*'
    - 'git push * --force*'
    - 'git push --delete *'
    - 'git push * :*'
    # Git: never force add a file ignored by .gitignore
    - 'git add *--force*'
    - 'git add --force*'
    - 'git add -*f*'
    # Git: never change git config
    - 'git config *user*'
    - 'git config set*'
    - 'git config unset*'
    - 'git config edit*'
    - 'git config rename-section*'
    - 'git config remove-section*'
    # Git: never discard uncommitted work automatically
    - 'git reset --hard*'
    - 'git clean -fd*'
    - 'git clean -xdf*'
    - 'git checkout -- *'
    - 'git restore *'
    # Never destroy SSH access
    - 'rm * /etc/ssh/*'
    - 'rm -rf * /etc/ssh/*'
    - 'systemctl disable ssh*'
    - 'systemctl mask ssh*'
    - 'ufw deny * 22*'
    - 'ufw delete * 22*'
    # Never destroy authentication / privilege configuration
    - 'rm * /etc/passwd'
    - 'rm * /etc/shadow'
    - 'rm * /etc/group'
    - 'rm * /etc/gshadow'
    - 'rm * /etc/sudoers'
    - 'rm -rf * /etc/sudoers.d/*'
    - 'rm * /etc/sudoers.d/*'
    # Never remove the primary user or administrative groups
    - 'userdel *'
    - 'groupdel *'
    - 'gpasswd -d * sudo'
    - 'gpasswd -d * adm'
    # Never disable the firewall entirely
    - 'ufw disable'
    - 'ufw reset'
    - 'iptables -F*'
    - 'iptables --flush*'
    - 'nft flush ruleset'
    # Never intentionally take the machine offline
    - 'shutdown *'
    - 'poweroff *'
    - 'halt *'
    - 'reboot *'
    - 'systemctl poweroff*'
    - 'systemctl reboot*'
    - 'systemctl halt*'
    # Never wipe virtualization/container storage
    - 'docker system prune --volumes*'
    - 'docker volume prune*'
    - 'docker volume rm *'
    - 'podman system reset*'
    # Never remotely execute arbitrary downloaded code
    - '*curl*|*python*'
    - '*curl*|*perl*'
    - '*curl*|*ruby*'
    - '*wget*|*python*'
    - '*wget*|*perl*'
    - '*wget*|*ruby*'
    # Never alter the boot chain
    - 'rm * /boot/*'
    - 'rm -rf * /boot/*'
    - 'grub-install *'
    - 'efibootmgr *'
    # Never disable mandatory security controls
    - 'setenforce 0'
    - 'aa-disable *'
    - 'apparmor_parser -R *'